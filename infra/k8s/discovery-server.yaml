apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: nexus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-server
  template:
    metadata:
      labels:
        app: discovery-server
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: discovery-server
          image: ghcr.io/kritsn/nexus-discovery-server:latest
          ports:
            - containerPort: 8761
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8761
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8761
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  namespace: nexus
spec:
  selector:
    app: discovery-server
  ports:
    - port: 8761
      targetPort: 8761
